<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>ToDo List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tarefas">
  </head>
  <body class="min-vh-100 d-flex align-items-start justify-content-center py-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container" style="max-width: 540px;">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-check2-square fs-2 text-primary"></i>
            <h1 class="h3 mb-0 fw-bold">Minhas Tarefas</h1>
          </div>

          <form id="todo-form" class="mb-4">
            <div class="input-group">
              <input
                type="text"
                class="form-control form-control-lg rounded-start-3"
                id="input-box"
                placeholder="Digite uma nova tarefa..."
                autofocus
              />
              <button class="btn btn-primary btn-lg px-4 rounded-end-3" type="submit">
                <i class="bi bi-plus-lg me-1"></i> Adicionar
              </button>
            </div>
            <div id="feedback" class="form-text text-danger d-none">Digite uma tarefa antes de adicionar.</div>
          </form>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-semibold mb-0">
              Tarefas
              <span id="task-count" class="badge bg-secondary rounded-pill ms-1">0</span>
            </h2>
            <button id="clear-btn" class="btn btn-sm btn-outline-danger d-none">
              <i class="bi bi-trash3 me-1"></i> Limpar tudo
            </button>
          </div>

          <ul id="list-container" class="list-group list-group-flush"></ul>

          <div id="empty-state" class="text-center py-5 text-muted">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            <p class="mb-0">Nenhuma tarefa cadastrada.</p>
            <small>Adicione sua primeira tarefa acima!</small>
          </div>
        </div>
      </div>

      <p class="text-white text-center mt-3 opacity-75 small">
        <i class="bi bi-dot"></i> Clique na tarefa para marcar como concluída
      </p>
    </div>

    <script>
      const taskInput = document.querySelector('#input-box')
      const form = document.querySelector('#todo-form')
      const ul = document.querySelector('#list-container')
      const emptyState = document.querySelector('#empty-state')
      const taskCount = document.querySelector('#task-count')
      const feedback = document.querySelector('#feedback')
      const clearBtn = document.querySelector('#clear-btn')

      function carregarTasks() {
        const dados = localStorage.getItem('tasks')
        return dados ? JSON.parse(dados) : []
      }

      function salvarTasks() {
        localStorage.setItem('tasks', JSON.stringify(tasksList))
      }

      const tasksList = carregarTasks()

      function render() {
        salvarTasks()
        ul.innerHTML = ''

        if (tasksList.length === 0) {
          emptyState.classList.remove('d-none')
          clearBtn.classList.add('d-none')
        } else {
          emptyState.classList.add('d-none')
          clearBtn.classList.remove('d-none')
        }

        taskCount.textContent = tasksList.length

        tasksList.forEach(function(task, i) {
          if (!task.trim()) return
          const li = document.createElement('li')
          li.className = 'list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-bottom'
          li.style.transition = 'background 0.2s'
          li.innerHTML = `
            <span class="task-text flex-grow-1 me-3" role="button">${task}</span>
            <button class="btn btn-sm btn-outline-danger rounded-circle del-btn" data-index="${i}" title="Remover tarefa">
              <i class="bi bi-x-lg"></i>
          </button>`
          ul.appendChild(li)
        })
      }

      function addTask(event) {
        event.preventDefault()
        feedback.classList.add('d-none')

        const text = taskInput.value.trim()
        if (!text) {
          feedback.classList.remove('d-none')
          taskInput.focus()
          return
        }

        tasksList.push(text)
        taskInput.value = ''
        taskInput.focus()
        render()
      }

      function deleteTask(index) {
        tasksList.splice(index, 1)
        render()
      }

      function clearAll() {
        if (tasksList.length === 0) return
        tasksList.length = 0
        render()
      }

      form.addEventListener('submit', addTask)

      ul.addEventListener('click', function(e) {
        const delBtn = e.target.closest('.del-btn')
        if (delBtn) {
          const index = Number(delBtn.dataset.index)
          deleteTask(index)
          return
        }

        const taskText = e.target.closest('.task-text')
        if (taskText) {
          taskText.classList.toggle('text-decoration-line-through')
          taskText.classList.toggle('text-muted')
        }
      })

      clearBtn.addEventListener('click', clearAll)

      render()

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
      }
    </script>
  </body>
</html>
